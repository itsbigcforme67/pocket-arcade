<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161b">
  <title>Minigames</title>
  <style>
    :root { --bg: #14161b; --panel: #1e2128; --line: #323744; --text: #eceef3; --muted: #9aa1b2; --accent: #ffcb3d; --accent-ink: #2a1f00; color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100dvh; background: radial-gradient(90% 60% at 50% 0%, #262a35 0%, var(--bg) 70%) no-repeat, var(--bg); }
    a { color: var(--accent); }
    .wrap { max-width: 920px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 16px 40px; }
    .back { font-weight: 700; text-decoration: none; }
    h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 22px 0 6px; letter-spacing: -.02em; }
    .tag { color: var(--muted); margin: 0 0 26px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
      overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s ease, border-color .15s ease; }
    .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: #4a5266; outline: none; }
    .stage { height: 150px; display: grid; place-items: center; background: linear-gradient(160deg, #6b3a1e, #3a1f10); }
    .poster { width: 84px; height: 100px; background: #e9d3a1; border: 3px solid #8a5a2b; border-radius: 2px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; box-shadow: 0 10px 18px rgba(0,0,0,.4); transform: rotate(-3deg); }
    .poster b { font: 900 13px/1 system-ui, sans-serif; color: #7a2214; letter-spacing: .04em; }
    .poster span { font-size: 44px; line-height: 1; }
    .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .info h2 { margin: 0; font-size: 20px; }
    .info p { margin: 0; color: var(--muted); font-size: 14px; }
    .btn { margin-top: auto; align-self: flex-start; background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 8px 18px; border-radius: 12px; }
    .soon { border-style: dashed; justify-content: center; align-items: center; min-height: 200px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">‹ Pocket Arcade</a>
    <h1>Minigames</h1>
    <p class="tag">Quick touch-screen games. Play with a finger or a mouse, no files needed.</p>
    <div class="grid">
      <a class="card" href="wanted/">
        <div class="stage"><div class="poster"><b>WANTED</b><span>🐱</span></div></div>
        <div class="info">
          <h2>Wanted!</h2>
          <p>A poster shows one face. Find it in the crowd and tap it before the clock runs out. A catch adds 5 seconds, a wrong tap takes 10.</p>
          <span class="btn">Play ›</span>
        </div>
      </a>
      <div class="card soon">More on the way</div>
    </div>
  </div>
</body>
</html>
