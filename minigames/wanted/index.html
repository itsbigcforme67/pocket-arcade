<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14161b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wanted!">
  <title>Wanted!</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --bg: #14161b; --text: #eceef3; --muted: #9aa1b2; --accent: #ffcb3d; color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
      user-select: none; -webkit-user-select: none; touch-action: none; }
    body { display: flex; flex-direction: column; align-items: center; }
    .bar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: calc(env(safe-area-inset-top) + 6px) 12px 6px; }
    .bar a, .bar button { color: var(--accent); background: none; border: 0; font: inherit; font-weight: 700;
      text-decoration: none; padding: 6px 4px; cursor: pointer; white-space: nowrap; }
    .bar span { color: var(--muted); font-size: 13px; }
    @media (max-width: 520px) { .bar span { display: none; } }
    /* installed as an app: there is no site around it to go back to */
    @media (display-mode: standalone), (display-mode: fullscreen) { .bar .back { visibility: hidden; } }
    .standalone .bar .back { visibility: hidden; }
    #ds { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 0;
      padding-bottom: env(safe-area-inset-bottom); }
    canvas { display: block; background: #000; border-radius: 4px; }
    .hinge { height: 10px; }
    .right { display: flex; gap: 6px; }
    dialog { background: #1e2128; color: var(--text); border: 1px solid #323744; border-radius: 16px; padding: 18px 18px 14px; max-width: 320px; width: calc(100% - 32px); }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    dialog h2 { margin: 0 0 4px; font-size: 18px; }
    dialog p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .slots label { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
    .slots input { width: 100%; text-align: center; font-size: 30px; padding: 6px 0; border-radius: 10px; border: 1px solid #323744; background: #14161b; color: var(--text); }
    .err { min-height: 18px; color: #ff6b5a; font-size: 13px; margin: 8px 0 0; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .row button { font: inherit; font-weight: 700; border-radius: 10px; padding: 8px 14px; border: 1px solid #323744; background: #2b3140; color: var(--text); cursor: pointer; }
    .row button.ok { background: var(--accent); color: #2a1f00; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="bar">
    <a class="back" href="../">‹ Minigames</a>
    <span>Find the wanted face!</span>
    <div class="right">
      <button id="facesBtn" type="button">Faces</button>
      <button id="snd" type="button" aria-label="Sound on or off">Sound: on</button>
    </div>
  </div>
  <dialog id="facesDlg">
    <form method="dialog" id="facesForm">
      <h2>Faces</h2>
      <p>Pick any four different emoji. Each takes one character's place in the game.</p>
      <div class="slots">
        <label><input maxlength="16" autocomplete="off" aria-label="Face 1 (Mario's place)">Mario</label>
        <label><input maxlength="16" autocomplete="off" aria-label="Face 2 (Luigi's place)">Luigi</label>
        <label><input maxlength="16" autocomplete="off" aria-label="Face 3 (Wario's place)">Wario</label>
        <label><input maxlength="16" autocomplete="off" aria-label="Face 4 (Yoshi's place)">Yoshi</label>
      </div>
      <div class="err" id="facesErr"></div>
      <div class="row">
        <button type="button" id="facesReset">Defaults</button>
        <span><button type="button" id="facesCancel">Cancel</button> <button class="ok" id="facesSave">Save</button></span>
      </div>
    </form>
  </dialog>
  <div id="ds">
    <canvas id="top" aria-label="Top screen: the wanted poster and the time left"></canvas>
    <div class="hinge"></div>
    <canvas id="bot" aria-label="Touch screen: tap the wanted face"></canvas>
  </div>
<script>
'use strict';
/* =====================================================================
   Wanted! The rules, the timing and the movement are a line-by-line port of
   dScMgLuigi_c from the SM64DS decompilation. Positions are 20.12 fixed point
   (pixels << 12) and the game runs at a fixed 60 steps a second, as on the DS.
   Function names below match the decomp's names for the same routines.
   ===================================================================== */

// The four faces, in the game's own character order.
const DEFAULT_FACES = ['🫒', '🚕', '🎳', '🐱'];   // 0 Mario, 1 Luigi, 2 Wario, 3 Yoshi
let FACES = DEFAULT_FACES.slice();
try {
  const saved = JSON.parse(localStorage.getItem('pa-wanted-faces'));
  if (Array.isArray(saved) && saved.length === 4 && saved.every(f => typeof f === 'string' && f)) FACES = saved;
} catch (e) {}

/* ---------------------------------------------------------------------
   ROM TABLES, read from overlay 6 of the EU ROM (ASMP). These are the game's
   own numbers; each comment names the symbol they come from.
   --------------------------------------------------------------------- */
// Movers, in the order of the handler table data_ov006_02142254 (filled by
// __sinit_ov006_02130f64): mKind 0 = RestartPicture, 9 = TickPictureFlash,
// and a board's mover m runs as mKind m + 1.
const STOP = 0, DRIFT_FIXED = 1, DRIFT_LEVEL = 2, DRIFT_COL = 3, DRIFT_ROW = 4, DRIFT_RANDOM = 5, SWAY = 6, BOUNCE = 7;
// One row per board (board = level for levels 0..19, then a random 10..19).
//   mode:  data_ov006_0213ce98  0 scatter, 1 2x2 grid, 2 4x4 grid, 3 8x6 grid, 4 a row of 8
//   first: data_ov006_0213ce84  scatter: the wanted face is slot 0 (drawn under the rest)
//   mover: data_ov006_0213ceac  how this board's faces move
//   count: data_ov006_0213cee0  scatter: how many faces
const BOARDS = [
  { mode: 1, first: 0, mover: STOP,        count: 4   },  // 0  2x2
  { mode: 2, first: 0, mover: STOP,        count: 16  },  // 1  4x4
  { mode: 3, first: 0, mover: STOP,        count: 48  },  // 2  8x6
  { mode: 0, first: 1, mover: STOP,        count: 80  },  // 3
  { mode: 0, first: 1, mover: STOP,        count: 100 },  // 4
  { mode: 3, first: 0, mover: DRIFT_COL,   count: 48  },  // 5  8x6, columns sliding
  { mode: 0, first: 0, mover: STOP,        count: 80  },  // 6
  { mode: 0, first: 0, mover: STOP,        count: 100 },  // 7
  { mode: 0, first: 0, mover: STOP,        count: 100 },  // 8
  { mode: 4, first: 0, mover: STOP,        count: 8   },  // 9  a row along the top edge; always Luigi (ChooseTarget)
  { mode: 0, first: 0, mover: DRIFT_LEVEL, count: 80  },  // 10
  { mode: 0, first: 0, mover: SWAY,        count: 80  },  // 11
  { mode: 0, first: 0, mover: STOP,        count: 100 },  // 12
  { mode: 0, first: 0, mover: BOUNCE,      count: 80  },  // 13
  { mode: 0, first: 0, mover: STOP,        count: 100 },  // 14 special: a decoy sits 20 px above the wanted face
  { mode: 0, first: 0, mover: DRIFT_LEVEL, count: 90  },  // 15
  { mode: 0, first: 0, mover: STOP,        count: 100 },  // 16 special
  { mode: 0, first: 0, mover: STOP,        count: 110 },  // 17 special
  { mode: 0, first: 0, mover: SWAY,        count: 90  },  // 18
  { mode: 0, first: 0, mover: STOP,        count: 110 },  // 19 special
];
// Speed tables, one value per character (20.12 px per step).
const SPD_COL   = [0x0e00, 0x0e00, 0x0e00, 0x0e00];  // data_ov006_0212e858
const SPD_ROW   = [0x0e00, 0x0e00, 0x0e00, 0x0e00];  // data_ov006_0212e868
const SPD_RAND  = [0x0e00, 0x0a00, 0x0600, 0x0c00];  // data_ov006_0212e878
const SWAY_VX   = [0x1000, 0x0c00, 0x0800, 0x0e00];  // data_ov006_0212e888 top x speed
const SWAY_VY   = [-0x0e00, 0x0a00, 0x0800, 0x0c00]; // data_ov006_0212e898 y speed
const SWAY_ACC  = [0x00c0, 0x0080, 0x0040, 0x00a0];  // data_ov006_0212e8a8 x acceleration
const SPD_BOUNCE= [0x0e00, 0x0a00, 0x0600, 0x0c00];  // data_ov006_0212e8b8
const SPD_FIXED = [0x0e00, 0x0a00, 0x0600, 0x0c00];  // data_ov006_0212e8c8
const SPD_LEVEL = [0x0e00, 0x0a00, 0x0600, 0x0c00];  // data_ov006_0212e8d8
// Who is wanted: ten entries for under 10 s left, ten for 10-19 s, ten for 20 s or more.
const WANTED_PICK = [                                  // data_ov006_0213cec0
  0, 3, 1, 2, 0, 3, 1, 2, 3, 0,
  2, 0, 3, 1, 2, 0, 1, 3, 2, 1,
  3, 1, 2, 1, 0, 1, 2, 1, 1, 0,
];
const CURTAIN_START = [-0x40, 0x140];                  // data_ov006_0212e850
// Boards where the wanted face is never Yoshi and a decoy sits just above it (code, not a table).
const SPECIAL = new Set([0x0e, 0x10, 0x11, 0x13]);
/* -------------------------- end of ROM tables -------------------------- */

// The DS's s16 sine table (data_02082214): 4096 (sin, cos) pairs, 1.0 = 0x1000.
const SIN = new Int16Array(4096), COS = new Int16Array(4096);
for (let a = 0; a < 4096; a++) { SIN[a] = Math.round(Math.sin(a * Math.PI / 2048) * 4096); COS[a] = Math.round(Math.cos(a * Math.PI / 2048) * 4096); }
const mulfx = (a, b) => Math.floor((a * b + 0x800) / 4096);

// RandomIntInternal: a 32-bit LCG. The game uses bits 16..30 and scales them.
let seed = (Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0;
function rnd15() { seed = (Math.imul(seed, 0x0019660d) + 0x3c6ef35f) >>> 0; return (seed >>> 16) & 0x7fff; }
const pick = n => (rnd15() * n) >> 15;

/* ------------------------------ game state ------------------------------ */
const N = 120;
const g = {
  posX: new Int32Array(N), posY: new Int32Array(N), velX: new Int32Array(N), velY: new Int32Array(N),
  movePhase: new Uint16Array(N), blink: new Uint16Array(N), levelPhase: new Uint16Array(4),
  kind: new Uint8Array(N), started: new Uint8Array(N), active: new Uint8Array(N), chr: new Uint8Array(N), shown: new Uint8Array(N),
  grid: new Uint8Array(13 * 9 + 32), colDir: new Uint8Array(8), rowDir: new Uint8Array(6),
  penalty: Array.from({ length: 16 }, () => ({ x: 0, y: 0, velY: 0, timer: 0, active: 0, shown: 0, phase: 0 })),
  curtain: [0, 1].map(() => ({ x: 0, velX: 0, delay: 0, count: 0, active: 0, shown: 0, state: 0, phase: 0 })),
  reward: { x: 0, y: 0, velY: 0, timer: 0, active: 0, phase: 0, sparks: 0, shown: 0 },
  iris: { active: 0, state: 0, radius: 0 },
  state: 0, iconOn: 0, iconX: 0x80, iconY: 0x60, catchWait: 0,
  time: 10, timeTick: 0, board: 0, prevBoard: 0, filled: 0, target: 0, found: 0, wanted: 0,
  level: 0,     // unk_0bc: rounds cleared in a row
  score: 0,     // the HUD counter, +1 as each reward finishes
};
let mode = 'title';   // 'title' | 'play' | 'paused' (Faces dialog open) | 'over'
let best = 0;
try { best = +localStorage.getItem('pa-wanted-best') || 0; } catch (e) {}

/* --- penalties: the -10 that drops from a wrong face --- */
function updatePenalties() {
  for (const p of g.penalty) {
    if (!p.active) continue;
    if (p.phase === 0) {
      if (p.timer) { p.timer--; p.y += p.velY; p.velY += 0x100; }
      else { p.timer = 0x40; p.phase++; }
    } else if (p.timer) p.timer--;
    else { p.active = 0; p.shown = 0; }
  }
}
function addPenalty(i) {
  for (const p of g.penalty) {
    if (p.active) continue;
    Object.assign(p, { active: 1, shown: 1, timer: 0x10, x: g.posX[i], y: g.posY[i], velY: 0x1100, phase: 0 });
    g.time = Math.max(0, g.time - 10);
    return;
  }
}

/* --- the reward: +5 rises from the found face, then 5 s tick back on --- */
function startReward(i) {
  Object.assign(g.reward, { active: 1, x: g.posX[i], y: g.posY[i], timer: 16, phase: 0, shown: 1, sparks: 5, velY: -3840 });
}
function updateReward() {
  const r = g.reward;
  if (!r.active) return;
  if (r.phase === 0) {
    r.y += r.velY; r.velY -= 0x100;
    if (r.timer) { r.timer--; return; }
    r.timer = 0x40; r.phase++; return;
  }
  if (r.phase === 1) {
    if (r.timer) { r.timer--; return; }
    r.shown = 0; r.phase++;
    g.score = Math.min(9999, g.score + 1);
    if (g.score > best) { best = g.score; try { localStorage.setItem('pa-wanted-best', best); } catch (e) {} }
    return;
  }
  if (r.sparks) {
    if (++r.timer < 4) return;
    sfx('spark'); r.timer = 0; r.sparks--;
    g.time++;
    if (g.time >= 50) { g.time = 50; g.timeTick = 0; }
    return;
  }
  r.active = 0;
}

/* --- the iris: a circle that opens from the middle of the touch screen at the catch.
   Steps (data_ov006_021421ec): 0 IrisHold, 1 IrisGrow, 2 IrisStop. --- */
function startIris() { Object.assign(g.iris, { active: 1, state: 0, radius: 0x40000 }); }
function updateIris() {
  const s = g.iris;
  if (!s.active) return;
  if (s.state === 1) { s.radius += 0x2000; if ((s.radius >> 12) >= 0xa0) s.state++; }
  else if (s.state === 2) s.active = 0;   // the window is switched off; the new backdrop stays
}

/* --- curtains: two copies of the poster fly in from either side and land on top
   of each other in the middle. Motions (data_ov006_02142204): 0 CurtainStart,
   1 CurtainUpdate, 2 CurtainStateSlow. CurtainUpdate steps through
   (data_ov006_0214221c) 0 CurtainStateBounce, 1 CurtainStateHold, 2 CurtainStateFast. --- */
function resetCurtains() { for (const c of g.curtain) Object.assign(c, { active: 1, state: 0, delay: 0, count: 0, shown: 0, phase: 0 }); }
function done(c) { c.x = 0x80000; c.active = 0; c.phase = 0; }
function curtainStart(c, i) {
  if (c.delay) { c.delay--; return; }
  c.x = CURTAIN_START[i] << 12; c.shown = 1; c.state = 1;
  c.velX = i ? -0x8000 : 0x8000;
  if (g.level % 5 !== 0) { c.state = 2; c.velX = i ? -0x7000 : 0x7000; }
}
function curtainSlow(c, i) {     // most rounds: in from the side, braking to a stop
  if (++c.count === 0x1a && i === 0) sfx('thump');
  c.x += c.velX;
  const v = c.x >> 12;
  if (i === 0) { c.velX -= 0x140; if (v < 0x80 || c.velX <= 0) return; }
  else { c.velX += 0x140; if (v > 0x80 || c.velX >= 0) return; }
  done(c);
}
function curtainBounce(c, i) {   // every fifth round: overshoot to the far side...
  c.x += c.velX;
  const v = c.x >> 12;
  if (i === 0) { c.velX -= 0x100; if (v >= 0x140) { c.x = 0x140000; c.phase++; c.delay = 0x10; c.velX = -0x6000; } }
  else { c.velX += 0x100; if (v <= -0x40) { c.x = -0x40000; c.phase++; c.delay = 0x10; c.velX = 0x6000; } }
}
function curtainHold(c, i) {     // ...wait, then come back to the middle
  if (++c.count === 0x35 && i === 0) sfx('thump');
  if (c.delay) { c.delay--; return; }
  c.x += c.velX;
  const v = c.x >> 12;
  if (i === 0) { c.velX += 0x140; if (v > 0x80) return; }
  else { c.velX -= 0x140; if (v < 0x80) return; }
  done(c);
}
function curtainFast(c, i) {     // in the table, but nothing reaches it
  c.x += c.velX;
  const v = c.x >> 12;
  if (i === 0) { c.velX += 0x140; if (!(v >= 0x80 && c.velX > 0)) return; }
  else { c.velX -= 0x140; if (!(v <= 0x80 && c.velX < 0)) return; }
  done(c);
}
function curtainUpdate(c, i) { [curtainBounce, curtainHold, curtainFast][c.phase](c, i); }
function curtainsDone() {
  let n = 0;
  g.curtain.forEach((c, i) => { if (c.active) { [curtainStart, curtainUpdate, curtainSlow][c.state](c, i); n++; } });
  return n === 0;
}

/* --- the clock --- */
function tickTimer() {
  if (g.time !== 0) {
    if (++g.timeTick < 60) return;
    g.timeTick = 0;
    g.time = Math.max(0, g.time - 1);
    sfx(g.time <= 2 ? 'tickHi' : 'tick');
    return;
  }
  sfx('timeup');
  beginCatch(0);
}

/* --- the faces --- */
function tickPictureFlash(i) {
  if (g.blink[i]) g.blink[i]--;
  g.shown[i] = (g.blink[i] >> 2) & 1 ? 0 : 1;
  if (g.blink[i] !== 0) return;
  g.kind[i] = 0; g.shown[i] = 1;
}
function stepAngle(i, spd) {
  const a = g.movePhase[i] >> 4, s = spd[g.chr[i]];
  g.posX[i] += mulfx(COS[a], s);
  g.posY[i] += mulfx(SIN[a], s);
}
function wrapPicture(i) {
  const x = g.posX[i] >> 12, y = g.posY[i] >> 12;
  if (x > 0x110) g.posX[i] = -0x10000;
  if (x < -0x10) g.posX[i] = 0x110000;
  if (y > 0xd0) g.posY[i] = -0x10000;
  if (y < -0x10) g.posY[i] = 0xd0000;
}
function moveBounce(i) {
  if (!g.started[i]) { g.movePhase[i] = pick(16) << 12; g.started[i]++; return; }
  stepAngle(i, SPD_BOUNCE);
  const x = g.posX[i] >> 12, y = g.posY[i] >> 12;
  if (x > 0xf8) { g.movePhase[i] = 0x8000 - g.movePhase[i]; g.posX[i] = 0xf8000; }
  else if (x < 8) { g.movePhase[i] = 0x8000 - g.movePhase[i]; g.posX[i] = 0x8000; }
  if (y > 0xb8) { g.movePhase[i] = -g.movePhase[i]; g.posY[i] = 0xb8000; }
  else if (y < 8) { g.movePhase[i] = -g.movePhase[i]; g.posY[i] = 0x8000; }
}
function moveSway(i) {
  const c = g.chr[i];
  if (!g.started[i]) {
    g.movePhase[i] = 0; g.started[i]++;
    g.velX[i] = c === 0 ? SWAY_VX[c] : -SWAY_VX[c];
    g.velY[i] = SWAY_VY[c];
    return;
  }
  g.posX[i] += g.velX[i]; g.posY[i] += g.velY[i];
  if (g.movePhase[i] === 0) {
    if (g.velX[i] > 0) { g.velX[i] -= SWAY_ACC[c]; if (g.velX[i] <= 0) { g.velX[i] = 0; g.movePhase[i] = 2; } }
    else if (g.velX[i] < 0) { g.velX[i] += SWAY_ACC[c]; if (g.velX[i] >= 0) { g.velX[i] = 0; g.movePhase[i] = 1; } }
  } else if (g.movePhase[i] === 1) {
    g.velX[i] += SWAY_ACC[c]; if (g.velX[i] >= SWAY_VX[c]) g.movePhase[i] = 0;
  } else {
    g.velX[i] -= SWAY_ACC[c]; if (g.velX[i] <= -SWAY_VX[c]) g.movePhase[i] = 0;
  }
  wrapPicture(i);
}
function moveDriftRandom(i) {
  if (!g.started[i]) { g.movePhase[i] = pick(16) << 12; g.started[i]++; return; }
  stepAngle(i, SPD_RAND); wrapPicture(i);
}
function moveDriftRow(i) {     // rows of 8 slide left or right
  if (!g.started[i]) { g.started[i]++; g.movePhase[i] = g.rowDir[i >> 3] ? 0x8000 : 0; return; }
  stepAngle(i, SPD_ROW); wrapPicture(i);
}
function moveDriftCol(i) {     // columns slide up or down
  if (!g.started[i]) { g.started[i]++; g.movePhase[i] = g.colDir[i & 7] ? 0x4000 : 0xc000; return; }
  stepAngle(i, SPD_COL); wrapPicture(i);
}
function moveDriftLevel(i) {   // every face of one character shares a heading
  if (!g.started[i]) { g.movePhase[i] = g.levelPhase[g.chr[i]]; g.started[i]++; return; }
  stepAngle(i, SPD_LEVEL); wrapPicture(i);
}
function moveDriftFixed(i) {
  if (!g.started[i]) { g.movePhase[i] = 0x6000; g.started[i]++; return; }
  stepAngle(i, SPD_FIXED); wrapPicture(i);
}
function restartPicture(i) { g.shown[i] = 1; g.started[i] = 0; g.kind[i] = BOARDS[g.board].mover + 1; }
const MOVERS = [() => {}, moveBounce, moveSway, moveDriftRandom, moveDriftRow, moveDriftCol, moveDriftLevel, moveDriftFixed];
function runKind(i) {
  const k = g.kind[i];
  if (k === 0) restartPicture(i);
  else if (k === 9) tickPictureFlash(i);
  else MOVERS[k - 1](i);
}
function updatePictures() { for (let i = 0; i < N; i++) if (g.active[i]) runKind(i); }

/* --- the catch (or the time running out) --- */
function beginCatch(found) {
  const t = g.target - 1;
  g.iconX = g.posX[t] >> 12; g.iconY = g.posY[t] >> 12;
  g.iconOn = 0x60; g.state = 3;
  g.catchWait = 0xc8;
  if (g.level % 5 !== 4) g.catchWait += 8;
  if (!found) g.catchWait = 0x80;
  g.found = found;
  startIris(); g.iris.state = 1;
}

let touch = null;   // the newest press, in touch-screen pixels
function checkTouch() {
  if (!touch) return;
  const tx = touch.x, ty = touch.y;
  touch = null;
  const t = g.target - 1;
  let dx = tx - (g.posX[t] >> 12), dy = ty - (g.posY[t] >> 12);
  if (dx <= 16 && dx >= -16 && dy <= 16 && dy >= -16) {
    beginCatch(1);
    startReward(g.target - 1);
    sfx('found');
    return;
  }
  for (let i = 0; i < N; i++) {
    if (g.active[i] !== 1 || g.kind[i] === 9) continue;
    dx = tx - (g.posX[i] >> 12); dy = ty - (g.posY[i] >> 12);
    if (dx <= 16 && dx >= -16 && dy <= 16 && dy >= -16) {
      addPenalty(i);
      g.found = 0; g.kind[i] = 9; g.blink[i] = 0x40;
      if (g.time !== 0) sfx('miss');
      return;
    }
  }
}

/* --- building a board --- */
function otherThanWanted(n) {            // a random face that is not the wanted one
  let c = pick(n);
  if (c === g.wanted) c = (c + pick(n - 1) + 1) & 3;
  return c;
}
function placeBoardLayout() {
  const m = BOARDS[g.board].mode;
  let n = 0;
  const put = (x, y) => { g.posX[n] = x << 12; g.posY[n] = y << 12; g.active[n] = 1; g.kind[n] = 0; };
  if (m === 1) {                          // 2x2: one of each face
    const base = pick(4);
    g.target = pick(4);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      put(0x70 + j * 0x20, 0x50 + i * 0x20);
      g.chr[n] = (base + n) & 3;
      if (g.wanted === g.chr[n]) g.target = n + 1;
      n++;
    }
  } else if (m === 2 || m === 3) {        // 4x4 in the middle, or 8x6 across the screen
    const cols = m === 2 ? 4 : 8, rows = m === 2 ? 4 : 6, x0 = m === 2 ? 0x50 : 0x10, y0 = m === 2 ? 0x30 : 0x10;
    g.target = pick(cols * rows) + 1;
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      put(x0 + j * 0x20, y0 + i * 0x20);
      g.chr[n] = otherThanWanted(4);
      if (n === g.target - 1) g.chr[n] = g.wanted;
      n++;
    }
  } else {                                // a row of 8 just above the screen, never Yoshi
    g.target = pick(8) + 1;
    for (let i = 0; i < 8; i++) {
      put(0x10 + i * 0x20, 0);
      g.posY[n] = -(5 << 12);
      g.chr[n] = pick(3);
      if (g.wanted === g.chr[n]) { g.chr[n] += pick(2) + 1; if (g.chr[n] >= 3) g.chr[n] = 0; }
      if (n === g.target - 1) g.chr[n] = g.wanted;
      n++;
    }
  }
  for (let i = 0; i < 8; i++) g.colDir[i] = pick(2);
  for (let i = 0; i < 6; i++) g.rowDir[i] = pick(2);
  g.filled++;
}
function placeNextPicture() {            // scatter boards: one face per call on a 13 x 9 grid of 20 px cells
  if (g.filled) return;
  const b = BOARDS[g.board];
  if (b.mode !== 0) { placeBoardLayout(); return; }
  const lim = b.count, cur = g.target;
  let col = 0, row = 0;
  g.chr[cur] = otherThanWanted(4);
  if (cur === 0) {
    do { col = pick(13); row = pick(9); } while (col >= 6 && col <= 10 && row >= 4 && row <= 8);
    const jx = -2 + pick(5), jy = -2 + pick(5);
    if (b.first) {
      g.posX[0] = (col * 20 + jx + 8) << 12; g.posY[0] = (row * 20 + jy + 16) << 12;
      g.active[0] = 1; g.kind[0] = 0; g.chr[0] = g.wanted; g.grid[col * 9 + row] = 1;
      g.target++;
      return;
    }
    const n = lim - 1;
    g.posX[n] = (col * 20 + 8) << 12; g.posY[n] = (row * 20 + 16) << 12;
    g.active[n] = 1; g.kind[n] = 0; g.chr[n] = g.wanted; g.grid[col * 9 + row] = 1;
  }
  for (let tries = 0; ; tries++) {
    if (tries >= 100) { if (++col >= 12) { col = 0; if (++row >= 11) row = 0; } }
    else { col = pick(13); row = pick(9); }
    const cell = col * 9 + row;
    if (!g.grid[cell]) {
      const jx = -2 + pick(5), jy = -2 + pick(5);
      g.posX[cur] = (col * 20 + jx + 8) << 12; g.posY[cur] = (row * 20 + jy + 16) << 12;
      g.grid[cell] = 1;
      break;
    }
  }
  g.active[cur] = 1; g.kind[cur] = 0;
  g.target++;
  if (g.target >= (b.first ? lim : lim - 1)) {
    if (SPECIAL.has(g.board)) { g.posX[cur] = g.posX[lim - 1]; g.posY[cur] = g.posY[lim - 1] - 0x14000; }
    g.filled = 1;
    g.target = b.first ? 1 : lim;
  }
  if (!g.filled) return;
  for (let k = 0; k < 4; k++) g.levelPhase[k] = pick(16) << 12;
}
function chooseTarget() {
  const k = g.time >= 20 ? 20 : g.time >= 10 ? 10 : 0;
  g.wanted = WANTED_PICK[k + pick(10)];
  if (g.board === 9) g.wanted = 1;
  if (SPECIAL.has(g.board) && g.wanted === 3) g.wanted = pick(3);
  posterDirty = true;
}
function chooseBoard() {
  g.prevBoard = g.board;
  let lvl = g.level;
  if (lvl >= 20) {
    let p = pick(10);
    if (p + 10 === g.prevBoard) { p += pick(9) + 1; if (p >= 10) p -= 10; }
    lvl = p + 10;
  }
  g.board = lvl;
}
function resetBoard() {
  for (const a of [g.posX, g.posY, g.velX, g.velY, g.kind, g.active, g.chr, g.blink, g.movePhase, g.shown, g.grid]) a.fill(0);
  for (const p of g.penalty) Object.assign(p, { x: 0, y: 0, timer: 0, active: 0, shown: 0 });
  for (const c of g.curtain) { c.active = 0; c.shown = 0; }
  g.reward.active = 0; g.reward.shown = 0;
  Object.assign(g.iris, { active: 0, state: 0, radius: 0 });
  g.iconOn = 0; g.iconX = 0x80; g.iconY = 0x60; g.catchWait = 0;
  g.target = 0; g.found = 0; g.filled = 0;
}
// After a round: OnYoshiTryEat. restart = true is the game-over path (arg 0x12).
function nextRound(restart) {
  if (g.found) g.level = Math.min(0x270e, g.level + 1);
  if (restart) { g.time = 10; g.level = 0; g.score = 0; }
  resetBoard();
  chooseBoard();
  g.state = 0;
}

/* --- the four states of a round --- */
function stateSetup() { g.iconOn = 0; resetCurtains(); g.state = 1; chooseTarget(); }
function statePlace() {
  for (let i = 0; i < 8; i++) placeNextPicture();
  if (!curtainsDone() || !g.filled) return;
  g.state = 2;
}
function statePlay() {
  tickTimer();
  if (g.state === 3) return;
  updatePictures();
  checkTouch();
  updatePenalties();
}
function stateCatch() {
  updateIris(); updatePenalties(); updateReward();
  let flashing = 0;
  for (let i = 0; i < N; i++) if (g.active[i] && g.kind[i] === 9) { flashing++; tickPictureFlash(i); }
  if (flashing) return;
  for (let i = 0; i < N; i++) g.shown[i] = 0;
  if (!g.catchWait) return;
  g.iconOn = 1;
  if (--g.catchWait > 0) return;
  g.iconOn = 0;
  if (g.found) nextRound(false);
  else { mode = 'over'; overAt = frame; }
}
function step() {
  if (mode !== 'play') { touch = null; return; }
  [stateSetup, statePlace, statePlay, stateCatch][g.state]();
}

/* ------------------------------ drawing ------------------------------ */
const W = 256, H = 192;
const topC = document.getElementById('top'), botC = document.getElementById('bot');
const tctx = topC.getContext('2d'), bctx = botC.getContext('2d');
let S = 2;   // backing pixels per DS pixel
const faceCache = new Map();
function faceSprite(c, size) {   // each face pre-drawn once at the current resolution
  const key = c + ':' + size + ':' + S;
  let cv = faceCache.get(key);
  if (!cv) {
    cv = document.createElement('canvas');
    cv.width = cv.height = Math.ceil(size * S);
    const x = cv.getContext('2d');
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `${Math.round(size * S * 0.84)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    x.fillText(FACES[c], cv.width / 2, cv.height / 2 + size * S * 0.04);
    faceCache.set(key, cv);
  }
  return cv;
}
function drawFace(ctx, c, x, y, size = 32) { ctx.drawImage(faceSprite(c, size), x - size / 2, y - size / 2, size, size); }
function text(ctx, s, x, y, size, fill, align = 'center', stroke = '#000') {
  ctx.font = `900 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, size / 5); ctx.strokeStyle = stroke;
  ctx.strokeText(s, x, y); ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

// The poster, drawn once per round into its own canvas so the curtains can split it.
const poster = document.createElement('canvas');
let posterDirty = true;
const PW = 120, PH = 140, PY = 0x60 - 70;   // poster size; the curtains park its centre at y 0x60
function buildPoster() {
  poster.width = PW * S; poster.height = PH * S;
  const p = poster.getContext('2d');
  p.setTransform(S, 0, 0, S, 0, 0);
  p.fillStyle = '#e9d3a1'; p.fillRect(0, 0, PW, PH);
  p.strokeStyle = '#8a5a2b'; p.lineWidth = 4; p.strokeRect(2, 2, PW - 4, PH - 4);
  p.lineWidth = 1; p.strokeRect(7, 7, PW - 14, PH - 14);
  text(p, 'WANTED', PW / 2, 24, 20, '#7a2214', 'center', '#e9d3a1');
  p.fillStyle = '#fff6dc'; p.fillRect(PW / 2 - 38, 40, 76, 76);
  p.strokeStyle = '#8a5a2b'; p.strokeRect(PW / 2 - 38, 40, 76, 76);
  drawFace(p, g.wanted, PW / 2, 78, 64);
  posterDirty = false;
}

function drawTop() {
  const c = tctx;
  c.setTransform(S, 0, 0, S, 0, 0);
  const grd = c.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#6b3a1e'); grd.addColorStop(1, '#3a1f10');
  c.fillStyle = grd; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,.05)';
  for (let x = 0; x < W; x += 16) c.fillRect(x, 0, 1, H);   // plank lines
  if (mode === 'title') {
    text(c, 'WANTED!', W / 2, 70, 40, '#ffcb3d');
    FACES.forEach((f, i) => drawFace(c, i, 56 + i * 48, 128, 36));
    text(c, 'Best ' + best, W / 2, 172, 14, '#eceef3');
    return;
  }
  // DrawTimer: label and seconds (only once a round is under way)
  if (g.state >= 2 || mode === 'over') {
    text(c, 'TIME', 34, 16, 12, '#ffcb3d');
    text(c, String(g.time), 34, 38, 26, g.time <= 5 ? '#ff6b5a' : '#ffffff');
  }
  text(c, 'SCORE', 222, 16, 12, '#ffcb3d');
  text(c, String(g.score), 222, 38, 26, '#ffffff');
  // poster halves (the "curtains")
  if (posterDirty) buildPoster();
  const px = (W - PW) / 2;
  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(px, PY, PW, PH);   // where the poster lands
  for (const k of g.curtain) if (k.shown) c.drawImage(poster, (k.x >> 12) - PW / 2, PY, PW, PH);
}

function drawBot() {
  const c = bctx;
  c.setTransform(S, 0, 0, S, 0, 0);
  c.fillStyle = '#183a66'; c.fillRect(0, 0, W, H);
  if (g.iris.radius && mode !== 'title') {   // the iris opens on a new backdrop, which stays once it has opened
    c.save(); c.beginPath(); c.arc(128, 96, g.iris.active ? g.iris.radius / 4096 : 400, 0, Math.PI * 2); c.clip();
    c.fillStyle = g.found ? '#f2c94c' : '#4a4f5c'; c.fillRect(0, 0, W, H); c.restore();
  }
  if (mode === 'title') {
    text(c, 'Find the face on the poster', W / 2, 70, 15, '#ffffff');
    text(c, 'and tap it before time runs out.', W / 2, 92, 15, '#ffffff');
    text(c, 'Tap to start', W / 2, 140, 22, '#ffcb3d');
    return;
  }
  if (g.state !== 0) for (let i = 0; i < N; i++) if (g.shown[i] === 1) drawFace(c, g.chr[i], g.posX[i] >> 12, g.posY[i] >> 12);
  if (g.iconOn) drawFace(c, g.wanted, g.iconX, g.iconY);
  const r = g.reward;
  if (r.shown) {
    const x = Math.min(0xf0, Math.max(8, r.x >> 12)), y = Math.min(0xb8, Math.max(8, r.y >> 12));
    text(c, '+5', x, y, 18, '#7dff8a');
  }
  for (const p of g.penalty) {
    if (!p.shown) continue;
    const x = Math.min(0xe0, Math.max(0x10, p.x >> 12)), y = Math.min(0xb8, Math.max(8, p.y >> 12));
    text(c, '-10', x, y, 18, '#ff5a4a');
  }
  if (mode === 'over') {
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 40, W, 112);
    text(c, 'TIME UP', W / 2, 66, 26, '#ff6b5a');
    text(c, 'Score ' + g.score + '   Best ' + best, W / 2, 100, 16, '#ffffff');
    if (frame - overAt > 45) text(c, 'Tap to play again', W / 2, 132, 16, '#ffcb3d');
  }
}

function fit() {
  const bar = document.querySelector('.bar').offsetHeight;
  const availW = innerWidth - 16, availH = innerHeight - bar - 10 - 16;
  // any size works: the canvases are drawn at the screen's own resolution
  const k = Math.max(0.5, Math.min(availW / W, availH / (2 * H)));
  for (const cv of [topC, botC]) { cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; }
  const newS = Math.min(4, Math.max(1, Math.ceil(k * (devicePixelRatio || 1))));
  if (newS !== S || topC.width !== W * newS) {
    S = newS; faceCache.clear(); posterDirty = true;
    for (const cv of [topC, botC]) { cv.width = W * S; cv.height = H * S; }
  }
}
addEventListener('resize', fit);

/* ------------------------------ input ------------------------------ */
let overAt = 0;
botC.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioUnlock();
  if (mode === 'title') { mode = 'play'; nextRound(true); return; }
  if (mode === 'over') { if (frame - overAt > 45) { mode = 'play'; nextRound(true); } return; }
  const r = botC.getBoundingClientRect();
  const x = Math.max(0, Math.min(255, Math.floor((e.clientX - r.left) * W / r.width)));
  const y = Math.max(0, Math.min(191, Math.floor((e.clientY - r.top) * H / r.height)));
  touch = { x, y };
});
topC.addEventListener('pointerdown', e => { e.preventDefault(); if (mode === 'title') { audioUnlock(); mode = 'play'; nextRound(true); } });

/* ------------------------------ faces ------------------------------ */
const dlg = document.getElementById('facesDlg');
const inputs = [...dlg.querySelectorAll('input')];
const facesErr = document.getElementById('facesErr');
let pausedFor = null;   // the mode to go back to when the dialog closes
const firstGrapheme = s => {
  s = s.trim();
  if (!s) return '';
  if (window.Intl && Intl.Segmenter) { for (const { segment } of new Intl.Segmenter().segment(s)) return segment; }
  return Array.from(s)[0];
};
function openFaces() {
  inputs.forEach((el, i) => { el.value = FACES[i]; });
  facesErr.textContent = '';
  if (mode === 'play') { pausedFor = 'play'; mode = 'paused'; }
  dlg.showModal();
}
function closeFaces() { dlg.close(); }
dlg.addEventListener('close', () => { if (pausedFor) { mode = pausedFor; pausedFor = null; last = performance.now(); } });
document.getElementById('facesBtn').addEventListener('click', openFaces);
document.getElementById('facesCancel').addEventListener('click', closeFaces);
document.getElementById('facesReset').addEventListener('click', () => { inputs.forEach((el, i) => { el.value = DEFAULT_FACES[i]; }); facesErr.textContent = ''; });
inputs.forEach(el => el.addEventListener('focus', () => el.select()));
document.getElementById('facesForm').addEventListener('submit', e => {
  const picked = inputs.map(el => firstGrapheme(el.value));
  if (picked.some(f => !f)) { e.preventDefault(); facesErr.textContent = 'Fill in all four.'; return; }
  if (new Set(picked).size < 4) { e.preventDefault(); facesErr.textContent = 'The four faces must all be different.'; return; }
  FACES = picked;
  try { localStorage.setItem('pa-wanted-faces', JSON.stringify(FACES)); } catch (err) {}
  faceCache.clear(); posterDirty = true;
});

/* ------------------------------ sound ------------------------------ */
let actx = null, soundOn = true;
try { soundOn = localStorage.getItem('pa-wanted-sound') !== 'off'; } catch (e) {}
const sndBtn = document.getElementById('snd');
const showSnd = () => { sndBtn.textContent = 'Sound: ' + (soundOn ? 'on' : 'off'); };
showSnd();
sndBtn.addEventListener('click', () => { soundOn = !soundOn; showSnd(); try { localStorage.setItem('pa-wanted-sound', soundOn ? 'on' : 'off'); } catch (e) {} });
function audioUnlock() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.08, when = 0, slide = 0) {
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(name) {
  if (!soundOn || !actx) return;
  switch (name) {
    case 'tick': tone(880, 0.05, 'square', 0.04); break;
    case 'tickHi': tone(1320, 0.08, 'square', 0.06); break;
    case 'found': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.07, i * 0.07)); break;
    case 'miss': tone(220, 0.25, 'sawtooth', 0.07, 0, 110); break;
    case 'spark': tone(1568, 0.06, 'triangle', 0.08); break;
    case 'thump': tone(140, 0.12, 'triangle', 0.15, 0, 60); break;
    case 'timeup': [440, 349, 262].forEach((f, i) => tone(f, 0.22, 'square', 0.07, i * 0.18)); break;
  }
}

/* ------------------------------ main loop ------------------------------ */
let frame = 0, acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); frame++; acc -= 1000 / 60; }
  drawTop(); drawBot();
  requestAnimationFrame(loop);
}
// Starting values, as InitResources sets them.
resetBoard(); g.board = 0xff; chooseBoard(); g.state = 0; g.time = 10;
fit();
requestAnimationFrame(loop);
if (navigator.standalone) document.documentElement.classList.add('standalone');   // iOS home-screen app
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
