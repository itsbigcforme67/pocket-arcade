<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tricky Wicks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#c3c7cd; --shell:#e6e8eb; --shell-edge:#aeb3ba; --ink:#2f3033; --muted:#5d5e60;
  --bezel:#444444; --pad:#444444; --pad-ink:#a2a7af; --pill:#8f8f8f; --pill-ink:#1f2022;
  --a:#f77622; --a-ink:#2a1203; --b:#124e89; --b-ink:#e6eef6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#121314; --shell:#28292c; --shell-edge:#17181a; --ink:#e3e5e8; --muted:#a2a7af;
    --bezel:#0d0d0e; --pad:#5d5e60; --pad-ink:#e3e5e8; --pill:#444548; --pill-ink:#e3e5e8;
  }
}
:root[data-theme="dark"]{
  --page:#121314; --shell:#28292c; --shell-edge:#17181a; --ink:#e3e5e8; --muted:#a2a7af;
  --bezel:#0d0d0e; --pad:#5d5e60; --pad-ink:#e3e5e8; --pill:#444548; --pill-ink:#e3e5e8;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--shell);color:var(--ink);
  font-family:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  display:flex;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
.unit{
  width:100%;max-width:30rem;height:100%;min-height:31rem;
  display:flex;flex-direction:column;gap:.75rem;padding:.75rem .75rem .9rem;background:var(--shell);
}
.screen{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.bezel{background:var(--bezel);padding:10px;border-radius:10px 10px 24px 10px;line-height:0}
canvas{display:block;touch-action:none;image-rendering:pixelated;background:#a2a7af}

.controls{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 .35rem}
button{font:inherit;color:inherit;border:0;margin:0;padding:0;cursor:pointer;touch-action:none}
button:focus-visible{outline:3px solid var(--a);outline-offset:3px}

.dpad{display:grid;grid-template-columns:repeat(3,3rem);grid-template-rows:repeat(3,3rem)}
.dpad button,.dpad i{background:var(--pad);color:var(--pad-ink);display:grid;place-items:center}
.dpad svg{width:1.05rem;height:1.05rem;fill:currentColor}
.dpad .up{grid-area:1/2;border-radius:.55rem .55rem 0 0}
.dpad .left{grid-area:2/1;border-radius:.55rem 0 0 .55rem}
.dpad i{grid-area:2/2}
.dpad .right{grid-area:2/3;border-radius:0 .55rem .55rem 0}
.dpad .down{grid-area:3/2;border-radius:0 0 .55rem .55rem}
.dpad button.on{filter:brightness(1.35)}

.ab{display:flex;gap:.9rem;align-items:center;transform:rotate(-18deg);padding-right:.2rem}
.ab button{width:3.75rem;height:3.75rem;border-radius:50%;font-weight:600;font-style:italic;font-size:1.35rem;
  box-shadow:0 3px 0 rgba(0,0,0,.28)}
.ab .a{background:var(--a);color:var(--a-ink)}
.ab .b{background:var(--b);color:var(--b-ink)}
.ab button.on{transform:translateY(3px);box-shadow:none}

.pills{flex:0 0 auto;display:flex;justify-content:center;gap:.75rem}
.pills button{background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:.4rem 1.05rem;
  font-weight:600;font-size:.95rem;min-width:6.2rem}
.pills button.on{filter:brightness(1.2)}

.how{flex:0 0 auto;margin:0;text-align:center;font-weight:500;font-size:.9rem;line-height:1.35;color:var(--muted)}
.how .keys{display:none}
@media (hover:hover) and (pointer:fine){ .how .keys{display:inline} }

@media (min-width:36rem){
  body{background:var(--page)}
  .unit{max-width:34rem;height:min(100%,48rem);margin:auto;border-radius:1rem 1rem 3.5rem 1rem;border:1px solid var(--shell-edge);padding:1.1rem 1.1rem 1.3rem}
}
</style>
</head>
<body>
<main class="unit">
  <div class="screen" id="screen">
    <div class="bezel"><canvas id="lcd" width="160" height="144" aria-label="Tricky Wicks game screen"></canvas></div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="up" data-k="up" aria-label="Drop the block"><svg viewBox="0 0 10 10"><path d="M5 1 9 8H1z"/></svg></button>
      <button class="left" data-k="left" aria-label="Move left"><svg viewBox="0 0 10 10"><path d="M1 5 8 1v8z"/></svg></button>
      <i></i>
      <button class="right" data-k="right" aria-label="Move right"><svg viewBox="0 0 10 10"><path d="M9 5 2 1v8z"/></svg></button>
      <button class="down" data-k="down" aria-label="Fall faster"><svg viewBox="0 0 10 10"><path d="M5 9 9 2H1z"/></svg></button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" aria-label="Turn left">B</button>
      <button class="a" data-k="a" aria-label="Turn right">A</button>
    </div>
  </div>

  <div class="pills">
    <button id="snd" data-k="sound" aria-pressed="true">Sound on</button>
    <button data-k="start">Start</button>
  </div>

  <p class="how">Run a wick from a flame to a bomb. Up drops the block, A and B turn it.<span class="keys"> On a keyboard: arrows, Z and X, Enter to start or pause.</span></p>
</main>

    g.fillStyle = C0; g.fillRect(115, 120, 42, 4);
    g.fillStyle = C2; g.fillRect(115, 120, Math.floor(42 * P.power / METER_MAX), 4);
    textC(g, String(P.score).padStart(6, '0'), PC, 127);
  } else {
    nextPiece(PC - 8, 22);
    textC(g, String(P ? P.score : 0).padStart(6, '0'), PC, 64);
    textC(g, String(best).padStart(6, '0'), PC, 87);
    textC(g, 'LV ' + String(P ? P.level : 1).padStart(2, '0'), PC, 109);
    textC(g, 'x' + String(P ? P.bestWick : 0).padStart(2, '0'), PC, 129);
  }

  g.save(); g.beginPath(); g.rect(FX, FY, COLS * TS, ROWS * TS); g.clip();
  if (mode === 'title') drawTitle();
  else {
    const grid = P.grid, piece = P.piece;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = grid[r][c]; if (x) drawCell(x, FX + c * TS, FY + r * TS - (x.off || 0));
    }
    if (piece) drawCell(piece, FX + piece.col * TS, FY + piece.py);
    for (const f of P.fx) if (f.k === 'boom') burst(f.x, f.y, f.t);
    for (const f of P.fx) if (f.k === 'pop' && f.t >= 8) { const hw = textW(f.s) / 2 + 2; textO(g, f.s, Math.max(FX + hw, Math.min(FX + COLS * TS - hw, f.x)), Math.max(FY + 1, f.y - Math.min(14, f.t >> 1))); }
    if (duel && P.incoming && mode === 'play' && ((frame >> 3) & 1)) textO(g, '+' + P.incoming, FX + 84, FY + 2); // blocks on their way, shown clear of the column pieces come in through
    if (mode === 'over') {
      if (P.over) {
        const rows = Math.min(ROWS, Math.floor(overT / 4));
        for (let i = 0; i < rows; i++) for (let c = 0; c < COLS; c++) spr(g, ...SRC.block, FX + c * TS, FY + (ROWS - 1 - i) * TS);
      }
      if (overT > 40) {
        box(FX + 8, 40, 80, 66);
        const top = versus ? 'YOU' : 'GAME', bottom = versus ? (won ? 'WIN' : 'LOSE') : 'OVER';
        textC(g, top, FX + 48, 46, C3, 2); textC(g, bottom, FX + 48, 63, C3, 2);
        if (reduce || ((frame >> 5) & 1) === 0) textC(g, 'PRESS START', FX + 48, 84);
        textC(g, 'B - MENU', FX + 48, 94, C2);
      }
    } else if (paused) {
      box(FX + 16, 58, 64, 26); textC(g, 'PAUSE', FX + 48, 64, C3, 2);
    }
  }
  g.restore();

  const shake = P ? P.shake : 0, ox = shake > 0 && !paused ? ((shake & 2) ? 1 : -1) : 0;
  out.fillStyle = C0; out.fillRect(0, 0, cv.width, cv.height);
  out.drawImage(buf, 0, 0, W, H, ox * K, 0, W * K, H * K);
}

/* ---------- input ---------- */
function down(k) { wake(); if (!held[k]) pressed[k] = true; held[k] = true; }
function up(k) { held[k] = false; }
const KEYS = { ArrowLeft:'left', ArrowRight:'right', ArrowDown:'down', ArrowUp:'up', Space:'up',
  KeyX:'a', KeyZ:'b', Enter:'start', KeyP:'start', KeyM:'sound' };
addEventListener('keydown', e => { const k = KEYS[e.code]; if (!k || e.metaKey || e.ctrlKey || e.altKey) return; e.preventDefault(); if (!e.repeat) down(k); });
addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) up(k); });
for (const b of document.querySelectorAll('button[data-k]')) {
  const k = b.dataset.k;
  const off = () => { up(k); b.classList.remove('on'); };
  let touched = -1e9;
  b.addEventListener('pointerdown', e => { e.preventDefault(); touched = performance.now(); down(k); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} });
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('click', () => { if (performance.now() - touched > 800) { down(k); setTimeout(() => up(k), 60); } }); // activation without a pointer
}
function toggleSound() {
  soundOn = !soundOn;
  const b = document.getElementById('snd'); b.textContent = soundOn ? 'Sound on' : 'Sound off'; b.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) sndBeep(660, .06, .05);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') paused = true; for (const k in held) held[k] = false; });

/* ---------- main loop (fixed 60 Hz, like the hardware) ---------- */
let last = 0, acc = 0, hold = false;
function loop(ts) {
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) { if (!hold) step(); acc -= 1000 / 60; n++; }
  render();
  requestAnimationFrame(loop);
}
atlas.onload = () => {
  buildBg(bg, false); buildBg(bgVs, true); fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('screen')); else addEventListener('resize', fit);
  requestAnimationFrame(loop);
};
atlas.src = ATLAS_SRC;

})();
</script>
